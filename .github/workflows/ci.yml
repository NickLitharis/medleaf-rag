name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_corpus:
        description: "Download the 10-PDF EMA corpus and run its acceptance tests (network, opt-in)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: lint and fast tests (no corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Pytest (offline; corpus checks stay skipped)
        env:
          PYTHONPATH: src
        run: python -m pytest -q

  # The real EMA PDFs are not committed (data/raw/ is ignored), so the corpus is an
  # explicit, network-dependent opt-in. It is never run on push or pull_request, and
  # this job downloads the assets before it can claim they passed.
  corpus:
    name: EMA corpus acceptance (opt-in, network)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_corpus }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Resolve, download and verify the corpus
        env:
          PYTHONPATH: src
        run: |
          python -m medleaf.cli resolve Eliquis Humira Jardiance Ozempic Xarelto
          python -m medleaf.cli download
          python -m medleaf.cli check
      - name: Corpus acceptance tests
        env:
          PYTHONPATH: src
          MEDLEAF_M1_CORPUS: "1"
        run: python -m pytest tests/test_m1_acceptance.py -q
