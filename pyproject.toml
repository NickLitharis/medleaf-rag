[project]
name = "medleaf-rag"
version = "0.1.0"
description = "Comparing k-means and e-means clustering of multilingual E5 embeddings of official EU medicine information (Greek/English)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nikos Litharis" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyMuPDF>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Embedding is heavy (torch + transformers); the fast test suite does not need it.
embedding = [
    "numpy>=1.26",
    "sentence-transformers>=3.0,<6",
    "huggingface_hub>=0.23",
]
# The clustering comparison in experiments/e-means.
compare = [
    "numpy>=1.26",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.scripts]
medleaf = "medleaf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medleaf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "network: test that downloads from ema.europa.eu (deselect with '-m \"not network\"')",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "PTH", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
# Experiment scripts print their results by design.
"experiments/**" = ["T20"]
# CLI entry points print their reports by design.
"src/medleaf/cli.py" = ["T20"]
"src/medleaf/ingest/ema.py" = ["T20"]
